<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Values Card Sort &middot; Desire Path</title>
<meta name="description" content="A sorting instrument for the Identity session of Desire Path. 124 cards drawn from the classical virtue tradition.">
<meta name="robots" content="noindex">
<style>
:root{
  --ink:#1D1801;
  --ink-soft:#5a5340;
  --ink-faint:#8d8672;
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --rule:#e2ded1;
  --tint:#f6f4ec;
  --lived:#2f6b4f;
  --reaching:#2f5c8a;
  --inherited:#8a6d1f;
  --notmine:#9a3b2f;
  --radius:14px;
  --shadow:0 1px 2px rgba(29,24,1,.08), 0 8px 28px rgba(29,24,1,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Helvetica,"Helvetica Neue",sans-serif;
  color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overscroll-behavior:none;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#f2eee2; --ink-soft:#b9b3a1; --ink-faint:#8b8574;
    --paper:#14130f; --card:#1e1c16; --rule:#332f25; --tint:#1b1913;
    --lived:#79c39b; --reaching:#8fb8e0; --inherited:#d9b95c; --notmine:#e08b7c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
  }
}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.app{min-height:100svh;display:flex;flex-direction:column}

header.bar{
  border-bottom:1px solid var(--rule);
  padding:10px 0; position:sticky; top:0; z-index:20;
  background:var(--paper);
}
.bar .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.stepper{display:flex;gap:5px;align-items:center;flex:1;justify-content:center}
.step{width:20px;height:4px;border-radius:2px;background:var(--rule)}
.step.done{background:var(--ink-soft)}
.step.now{background:var(--ink)}
.linkbtn{background:none;border:0;padding:6px;color:var(--ink-soft);font-size:13px;text-decoration:underline}

main{flex:1;display:flex;flex-direction:column;padding:20px 0 28px}
h1{font-size:30px;line-height:1.18;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:21px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:16px;margin:22px 0 4px}
p{margin:0 0 14px;max-width:62ch}
.lede{color:var(--ink-soft)}
.small{font-size:14px;color:var(--ink-soft)}
.tiny{font-size:12.5px;color:var(--ink-faint)}

.btn{
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  border-radius:999px; padding:12px 22px; font-size:16px; font-weight:bold;
}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.quadkey{border-top:1px solid var(--rule);margin:18px 0 22px}
.quadrow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.quadrow b{font-size:15px;white-space:nowrap;min-width:96px}
.quadrow span{font-size:14px;color:var(--ink-soft)}
.k-lived{color:var(--lived)} .k-reaching{color:var(--reaching)}
.k-inherited{color:var(--inherited)} .k-notmine{color:var(--notmine)}

.deckarea{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:320px;padding:6px 0 4px}
.stack{position:relative;width:100%;max-width:400px;height:min(50svh,400px);min-height:280px}
.tcard{
  position:absolute;inset:0;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:24px;display:flex;flex-direction:column;
  touch-action:none;user-select:none;-webkit-user-select:none;
  will-change:transform;
}
.tcard.under{pointer-events:none}
.tcard .themetag{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.tcard .word{font-size:clamp(28px,7.5vw,40px);line-height:1.08;letter-spacing:-.025em;margin:auto 0 0;font-weight:bold}
.tcard .term{font-style:italic;color:var(--ink-faint);font-size:15px;margin-top:6px;min-height:1.4em}
.tcard .gloss{font-size:17px;color:var(--ink-soft);margin:14px 0 auto;line-height:1.45}
.tcard .flipnote{font-size:12.5px;color:var(--ink-faint);margin-top:14px}
.tcard .front{display:flex;flex-direction:column;height:100%}
.tcard .back{display:none}
.tcard.flipped .front{display:none}
.tcard.flipped .back{display:flex;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.back .line{font-size:19px;line-height:1.35;margin:10px 0 16px;font-weight:bold}
.back .meta{font-size:13.5px;color:var(--ink-soft);margin-bottom:4px}
.back .nearlist{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule)}
.back .nearlist b{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:5px}
.back .nearlist span{font-size:14px;color:var(--ink-soft)}
.verdict{
  position:absolute;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:bold;padding:6px 11px;border-radius:6px;border:2px solid currentColor;opacity:0;
  pointer-events:none;
}
.v-lived{top:50%;right:16px;transform:translateY(-50%);color:var(--lived)}
.v-notmine{top:50%;left:16px;transform:translateY(-50%);color:var(--notmine)}
.v-reaching{top:16px;left:50%;transform:translateX(-50%);color:var(--reaching)}
.v-inherited{bottom:16px;left:50%;transform:translateX(-50%);color:var(--inherited)}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:14px;max-width:420px;margin:0 auto;width:100%}
.cbtn{
  border:1px solid var(--rule);background:var(--card);border-radius:12px;
  padding:10px 12px;text-align:left;line-height:1.2;
}
.cbtn b{display:block;font-size:15px}
.cbtn i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.cbtn[data-v="lived"] b{color:var(--lived)}
.cbtn[data-v="reaching"] b{color:var(--reaching)}
.cbtn[data-v="inherited"] b{color:var(--inherited)}
.cbtn[data-v="notmine"] b{color:var(--notmine)}
.counts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding-top:12px;font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 0 14px}
.progress i{display:block;height:100%;background:var(--ink-soft);transition:width .2s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:12px 0}
.chip{
  border:1px solid var(--rule);background:var(--card);border-radius:10px;
  padding:11px 12px;text-align:left;line-height:1.25;
}
.chip b{display:block;font-size:15px}
.chip span{display:block;font-size:12px;color:var(--ink-faint);margin-top:3px}
.chip.on{border-color:var(--ink);background:var(--tint);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.sel{border-color:var(--lived);box-shadow:inset 0 0 0 2px var(--lived)}
.sticky{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  padding:12px 0;margin-top:auto;
}
.sticky .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
@media (max-width:520px){ .duel{grid-template-columns:1fr} }
.duelcard{
  border:1px solid var(--rule);background:var(--card);border-radius:var(--radius);
  padding:20px;text-align:left;min-height:140px;display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.duelcard:hover{border-color:var(--ink)}
.duelcard b{font-size:23px;letter-spacing:-.02em;line-height:1.1}
.duelcard i{font-style:italic;color:var(--ink-faint);font-size:13.5px;margin-top:4px}
.duelcard span{font-size:14.5px;color:var(--ink-soft);margin-top:10px}

.cluster{border:1px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.cluster header{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cluster input{
  font:inherit;font-weight:bold;font-size:16px;border:0;border-bottom:1px dashed var(--rule);
  background:transparent;color:inherit;padding:4px 2px;flex:1;min-width:0;
}
.cluster input:focus{outline:none;border-bottom-color:var(--ink)}
.cluster .members{display:flex;flex-wrap:wrap;gap:6px}
.member{border:1px solid var(--rule);border-radius:999px;padding:5px 10px;font-size:13.5px;background:var(--tint)}
.member button{border:0;background:none;padding:0 0 0 6px;color:var(--ink-faint)}
.drop{border:1px dashed var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-faint);background:transparent}
.drop.armed{border-color:var(--lived);color:var(--lived)}

.attrib{border-bottom:1px solid var(--rule);padding:14px 0}
.attrib b{font-size:18px;display:block}
.attrib em{font-style:normal;font-size:14px;color:var(--ink-soft);display:block;margin:2px 0 8px}
.attrib input{
  font:inherit;font-size:15px;width:100%;border:1px solid var(--rule);border-radius:8px;
  padding:9px 11px;background:var(--card);color:inherit;
}
.attrib input:focus{outline:none;border-color:var(--ink)}

.top5{counter-reset:t;margin:16px 0 26px;border-top:1px solid var(--rule)}
.top5 li{list-style:none;counter-increment:t;display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:flex-start}
.top5 li::before{content:counter(t);font-size:13px;color:var(--ink-faint);width:16px;padding-top:6px;font-variant-numeric:tabular-nums}
.top5 b{font-size:20px;letter-spacing:-.02em;display:block}
.top5 em{font-style:normal;font-size:15px;color:var(--ink-soft);display:block;margin-top:3px}
.top5 .who{font-size:13.5px;color:var(--ink-faint);display:block;margin-top:5px}
.tally{margin:8px 0 22px}
.tallyrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:14px}
.tallyrow b{width:78px;font-weight:normal}
.tallybar{flex:1;height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.tallybar i{display:block;height:100%;background:var(--ink-soft)}
.tallyrow span{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-faint)}
ul.plain{margin:0 0 18px;padding-left:18px}
ul.plain li{margin-bottom:6px}
.pilewrap{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 22px}
.note{border-left:2px solid var(--rule);padding-left:14px;margin:0 0 18px}

footer.foot{border-top:1px solid var(--rule);padding:16px 0 30px;font-size:12.5px;color:var(--ink-faint)}
.hidden{display:none !important}

@media print{
  header.bar,.sticky,.noprint{display:none !important}
  body{color:#000;background:#fff}
  .app{min-height:0}
}
</style>
</head>
<body>
<div class="app">

<header class="bar noprint">
  <div class="wrap">
    <div class="brand">Desire Path</div>
    <div class="stepper" id="stepper"></div>
    <button class="linkbtn" id="startover">Start over</button>
  </div>
</header>

<main id="main" class="wrap"><p class="lede">Loading the deck…</p></main>

<footer class="foot noprint"><div class="wrap">
  Everything you sort stays in this browser. Nothing you sort is uploaded, saved, or stored beyond your device.
</div></footer>

</div>

<script>
(function(){
"use strict";

var KEY = "dp-cards-v2";
var CAP_LIVED = 10;
var CAP_REACH = 5;
var DECK = null, CARDS = {}, THEMES = {};
var S = null;
var main = document.getElementById("main");

var BUCKETS = [
  { id:"lived",     label:"Lived",     hint:"Someone could point at the evidence.", key:"→" },
  { id:"reaching",  label:"Reaching",  hint:"I want this. The evidence is thin.",   key:"↑" },
  { id:"inherited", label:"Inherited", hint:"It is in me. I am not sure I chose it.", key:"↓" },
  { id:"notmine",   label:"Not my path", hint:"Someone else's good, honestly.",     key:"←" }
];

function freshState(){
  return {
    stage:"welcome",
    order:[], i:0,
    lived:[], reaching:[], inherited:[], notmine:[],
    history:[],
    keepL:[], keepR:[],
    rank:null,
    clusters:[], picked:[],
    attrib:{},
    started:null
  };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ var raw = localStorage.getItem(KEY); if(!raw) return null;
    var o = JSON.parse(raw); return (o && o.stage) ? o : null; }catch(e){ return null; }
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }
function capL(){ return Math.min(CAP_LIVED, S.lived.length + S.inherited.length); }
function capR(){ return Math.min(CAP_REACH, S.reaching.length); }

var STAGES = ["welcome","triage","cutlived","cutreach","duel","cluster","attribute","result"];
function drawStepper(){
  var el = document.getElementById("stepper"), now = STAGES.indexOf(S.stage), h="";
  for(var i=1;i<STAGES.length;i++){ h += '<i class="step'+(i<now?" done":i===now?" now":"")+'"></i>'; }
  el.innerHTML = h;
}
function go(stage){ S.stage = stage; save(); render(); }

var lastStage = null;
function render(){
  drawStepper();
  if(S.stage !== lastStage){ window.scrollTo(0,0); lastStage = S.stage; }
  var f = ({ welcome:vWelcome, triage:vTriage, cutlived:vCutLived, cutreach:vCutReach,
             duel:vDuel, cluster:vCluster, attribute:vAttribute, result:vResult })[S.stage];
  if(!f){ S.stage="welcome"; f=vWelcome; }
  main.innerHTML = "";
  f();
}

/* ---------------- welcome ---------------- */

function vWelcome(){
  var resumable = S.order.length && S.stage !== "welcome";
  main.innerHTML =
    '<h1>What is actually true of you?</h1>'+
    '<p class="lede">'+DECK.cards.length+' values from the classical tradition, one per card. '+
      'Every one of them is a good, so approving of them proves nothing. '+
      'This sort is looking for evidence instead.</p>'+
    '<p class="lede">Each card goes in one of four places:</p>'+
    '<div class="quadkey">'+ BUCKETS.map(function(b){
      return '<div class="quadrow"><b class="k-'+b.id+'">'+b.label+'</b><span>'+esc(b.hint)+'</span></div>';
    }).join("") +'</div>'+
    '<p class="lede small">Then you cut the Lived pile to '+CAP_LIVED+' and the Reaching pile to '+
      CAP_REACH+'. Those caps are the point. A value you hold above every other is worth something; '+
      'ninety values you approve of are worth very little.</p>'+
    '<p class="small">Twenty minutes or so, and it works better in one sitting.</p>'+
    '<div class="row">'+
      '<button class="btn" id="begin">'+(resumable?"Start a new sort":"Begin")+'</button>'+
      (resumable?'<button class="btn ghost" id="resume">Pick up where I left off</button>':'')+
    '</div>';

  document.getElementById("begin").onclick = function(){
    S = freshState();
    S.order = shuffle(DECK.cards.map(function(c){ return c.id; }));
    S.started = Date.now();
    go("triage");
  };
  var r = document.getElementById("resume");
  if(r) r.onclick = function(){ render(); };
}

/* ---------------- triage ---------------- */

function cardFace(c){
  var t = THEMES[c.theme];
  var near = (c.near||[]).map(function(n){ return CARDS[n] ? CARDS[n].word : null; })
                          .filter(Boolean).join(" · ");
  return ''+
  '<div class="front">'+
    '<div class="themetag">'+esc(t?t.name:"")+'</div>'+
    '<div class="word">'+esc(c.word)+'</div>'+
    '<div class="term">'+esc(c.term||"")+'</div>'+
    '<div class="gloss">'+esc(c.gloss)+'</div>'+
    '<div class="flipnote">Tap for more</div>'+
  '</div>'+
  '<div class="back">'+
    '<div class="themetag">'+esc(c.word)+'</div>'+
    '<div class="line">'+esc(c.line)+'</div>'+
    '<div class="meta">'+esc(c.gloss)+'</div>'+
    '<div class="meta">'+(c.term?'<i>'+esc(c.term)+'</i> · ':'')+'carried by '+esc(c.srcName)+'</div>'+
    (near?'<div class="nearlist"><b>Close to</b><span>'+esc(near)+'</span></div>':'')+
  '</div>'+
  BUCKETS.map(function(b){ return '<div class="verdict v-'+b.id+'">'+b.label+'</div>'; }).join("");
}

function vTriage(){
  if(S.i >= S.order.length){ return go("cutlived"); }
  var pct = Math.round(S.i / S.order.length * 100);

  main.innerHTML =
    '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
    '<p class="tiny" style="text-align:center;margin:0 0 6px">'+
      'Where would someone who has watched you for thirty days put this?</p>'+
    '<div class="deckarea"><div class="stack" id="stack"></div></div>'+
    // laid out so each button sits where that swipe sends the card
    '<div class="controls">'+ ["notmine","lived","reaching","inherited"].map(function(id){
      var b = BUCKETS.filter(function(x){ return x.id===id; })[0];
      return '<button class="cbtn" data-v="'+b.id+'"><b>'+b.key+' '+b.label+'</b><i>'+esc(b.hint)+'</i></button>';
    }).join("") +'</div>'+
    '<div class="counts">'+
      '<span>'+(S.i+1)+' of '+S.order.length+'</span>'+
      '<span>Lived '+S.lived.length+'</span>'+
      '<span>Reaching '+S.reaching.length+'</span>'+
      '<span>Inherited '+S.inherited.length+'</span>'+
      '<button class="linkbtn" id="undo"'+(S.history.length?"":" disabled")+'>Undo</button>'+
    '</div>'+
    '<p class="tiny" style="text-align:center;margin-top:10px">Drag the card, use the buttons, or press the arrow keys. Space turns it over.</p>';

  var stack = document.getElementById("stack");
  var nextId = S.order[S.i+1];
  if(nextId){
    var u = document.createElement("div");
    u.className = "tcard under";
    u.style.transform = "scale(.965) translateY(10px)";
    u.innerHTML = cardFace(CARDS[nextId]);
    stack.appendChild(u);
  }
  var el = document.createElement("div");
  el.className = "tcard";
  el.innerHTML = cardFace(CARDS[S.order[S.i]]);
  stack.appendChild(el);
  wireCard(el);

  Array.prototype.forEach.call(document.querySelectorAll(".controls .cbtn"), function(b){
    b.onclick = function(){ fly(el, b.getAttribute("data-v")); };
  });
  var ub = document.getElementById("undo");
  if(ub) ub.onclick = undo;

  document.onkeydown = function(e){
    if(S.stage !== "triage") return;
    var map = { ArrowRight:"lived", ArrowUp:"reaching", ArrowDown:"inherited", ArrowLeft:"notmine" };
    if(map[e.key]){ e.preventDefault(); fly(el, map[e.key]); }
    else if(e.key === " "){ e.preventDefault(); el.classList.toggle("flipped"); }
    else if(e.key.toLowerCase() === "u"){ e.preventDefault(); undo(); }
  };
}

function wireCard(el){
  var sx=0, sy=0, dx=0, dy=0, dragging=false, moved=false, pid=null;
  var v = {};
  BUCKETS.forEach(function(b){ v[b.id] = el.querySelector(".v-"+b.id); });

  el.addEventListener("pointerdown", function(e){
    if(e.button) return;
    dragging=true; moved=false; pid=e.pointerId;
    sx=e.clientX; sy=e.clientY; dx=dy=0;
    el.setPointerCapture(pid);
    el.style.transition="none";
  });
  el.addEventListener("pointermove", function(e){
    if(!dragging || e.pointerId!==pid) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    if(Math.abs(dx)>6 || Math.abs(dy)>6) moved=true;
    el.style.transform = "translate("+dx+"px,"+dy+"px) rotate("+(dx*0.045)+"deg)";
    var horizontal = Math.abs(dx) >= Math.abs(dy);
    v.lived.style.opacity     = horizontal ? Math.max(0,Math.min(1, dx/90)) : 0;
    v.notmine.style.opacity   = horizontal ? Math.max(0,Math.min(1,-dx/90)) : 0;
    v.reaching.style.opacity  = horizontal ? 0 : Math.max(0,Math.min(1,-dy/90));
    v.inherited.style.opacity = horizontal ? 0 : Math.max(0,Math.min(1, dy/90));
  });
  function end(e){
    if(!dragging || (e && e.pointerId!==pid)) return;
    dragging=false;
    el.style.transition="transform .22s ease-out, opacity .22s ease-out";
    var horizontal = Math.abs(dx) >= Math.abs(dy);
    if(horizontal && dx >  95) return fly(el,"lived");
    if(horizontal && dx < -95) return fly(el,"notmine");
    if(!horizontal && dy < -95) return fly(el,"reaching");
    if(!horizontal && dy >  95) return fly(el,"inherited");
    el.style.transform="";
    BUCKETS.forEach(function(b){ v[b.id].style.opacity = 0; });
    if(!moved) el.classList.toggle("flipped");
  }
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function fly(el, verdict){
  var id = S.order[S.i];
  var x = verdict==="lived" ? 520 : verdict==="notmine" ? -520 : 0;
  var y = verdict==="reaching" ? -620 : verdict==="inherited" ? 620 : 0;
  el.style.transition = "transform .24s ease-in, opacity .24s ease-in";
  el.style.transform = "translate("+x+"px,"+y+"px) rotate("+(x*0.03)+"deg)";
  el.style.opacity = "0";
  S[verdict].push(id);
  S.history.push([id, verdict]);
  S.i++;
  save();
  setTimeout(function(){ document.onkeydown = null; render(); }, 170);
}

function undo(){
  var last = S.history.pop();
  if(!last) return;
  var arr = S[last[1]], k = arr.lastIndexOf(last[0]);
  if(k > -1) arr.splice(k,1);
  S.i = Math.max(0, S.i-1);
  save(); document.onkeydown = null; render();
}

/* ---------------- the two cuts ---------------- */

function cutScreen(opts){
  document.onkeydown = null;
  var pool = opts.pool();
  S[opts.field] = S[opts.field].filter(function(id){ return pool.indexOf(id) > -1; });
  var cap = opts.cap();

  if(!pool.length){
    main.innerHTML = '<h2>'+opts.title+'</h2>'+
      '<p class="small">'+opts.empty+'</p>'+
      '<div class="row"><button class="btn" id="next">Continue</button>'+
      '<button class="btn ghost" id="again">Sort again</button></div>';
    document.getElementById("next").onclick = opts.onNext;
    document.getElementById("again").onclick = function(){ S=freshState(); save(); go("welcome"); };
    return;
  }

  main.innerHTML =
    '<h2>'+opts.title+'</h2>'+
    '<p class="lede small">'+opts.blurb+'</p>'+
    '<div id="sections"></div>'+
    '<div class="sticky noprint"><div class="wrap">'+
      '<div class="small"><b id="cnt">'+S[opts.field].length+'</b> of '+cap+' chosen</div>'+
      '<button class="btn" id="next"'+(S[opts.field].length===cap?"":" disabled")+'>Continue</button>'+
    '</div></div>';

  var sec = document.getElementById("sections");
  opts.blocks().forEach(function(blk){
    if(blk.ids.length) sec.appendChild(chipBlock(blk.label, blk.ids));
  });
  document.getElementById("next").onclick = opts.onNext;

  function chipBlock(label, ids){
    var box = document.createElement("div");
    box.innerHTML =
      '<h3 class="tiny" style="letter-spacing:.11em;text-transform:uppercase;margin:18px 0 0">'+
        esc(label)+' · '+ids.length+'</h3><div class="grid">'+
      ids.map(function(id){
        var c = CARDS[id];
        return '<button class="chip'+(S[opts.field].indexOf(id)>-1?" on":"")+'" data-id="'+id+'">'+
               '<b>'+esc(c.word)+'</b><span>'+esc(c.line)+'</span></button>';
      }).join("")+'</div>';
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-id"), k = S[opts.field].indexOf(id);
        if(k > -1){ S[opts.field].splice(k,1); b.classList.remove("on"); }
        else {
          if(S[opts.field].length >= cap){
            b.animate([{transform:"translateX(0)"},{transform:"translateX(-4px)"},
                       {transform:"translateX(4px)"},{transform:"translateX(0)"}],{duration:180});
            return;
          }
          S[opts.field].push(id); b.classList.add("on");
        }
        save();
        document.getElementById("cnt").textContent = S[opts.field].length;
        document.getElementById("next").disabled = (S[opts.field].length !== cap);
      };
    });
    return box;
  }
}

function vCutLived(){
  cutScreen({
    field:"keepL",
    title:"Cut the Lived pile to "+capL(),
    blurb:"You called "+S.lived.length+" of them lived. Keep the "+capL()+
          " you would defend with a specific story. The Inherited pile sits underneath, "+
          "in case something there turns out to be yours after all.",
    empty:"Nothing landed in the Lived or Inherited piles, so there is nothing to cut here.",
    pool:function(){ return S.lived.concat(S.inherited); },
    cap:capL,
    blocks:function(){ return [ {label:"Lived", ids:S.lived}, {label:"Inherited", ids:S.inherited} ]; },
    onNext:function(){ S.rank=null; go("cutreach"); }
  });
}

function vCutReach(){
  cutScreen({
    field:"keepR",
    title:"Cut the Reaching pile to "+capR(),
    blurb:"These are the ones you want and cannot yet evidence. Keep "+capR()+
          ". This becomes your gap, and the gap is what the next ninety days are for.",
    empty:"Nothing landed in the Reaching pile, so there is no gap list to build.",
    pool:function(){ return S.reaching; },
    cap:capR,
    blocks:function(){ return [ {label:"Reaching", ids:S.reaching} ]; },
    onNext:function(){ go(S.keepL.length > 1 ? "duel" : "cluster"); }
  });
}

/* ---------------- duels ---------------- */

function initRank(){
  var pool = shuffle(S.keepL.slice());
  S.rank = { sorted:[pool[0]], queue:pool.slice(1), cur:null, lo:0, hi:0, asked:0 };
  nextItem();
}
function nextItem(){
  var r = S.rank;
  if(!r.queue.length){ r.cur = null; return; }
  r.cur = r.queue.shift(); r.lo = 0; r.hi = r.sorted.length;
}
function answer(preferCur){
  var r = S.rank, mid = (r.lo + r.hi) >> 1;
  if(preferCur) r.hi = mid; else r.lo = mid + 1;
  r.asked++;
  if(r.lo >= r.hi){ r.sorted.splice(r.lo, 0, r.cur); nextItem(); }
  save(); render();
}

function vDuel(){
  document.onkeydown = null;
  if(!S.rank) initRank();
  var r = S.rank;
  if(!r.cur) return go("cluster");

  var mid = (r.lo + r.hi) >> 1;
  var A = CARDS[r.cur], B = CARDS[r.sorted[mid]];
  var placed = r.sorted.length, all = S.keepL.length;

  main.innerHTML =
    '<div class="progress"><i style="width:'+Math.round((placed-1)/(all-1)*100)+'%"></i></div>'+
    '<h2>Keep one</h2>'+
    '<p class="lede small">If you could carry only one of these into the next ten years, which one? '+
      'Answer quickly. The first instinct is usually the honest one.</p>'+
    '<div class="duel">'+ dc(A,"a") + dc(B,"b") +'</div>'+
    '<p class="tiny" style="text-align:center">'+placed+' of '+all+' placed. Press 1 or 2.</p>';

  document.getElementById("d-a").onclick = function(){ answer(true); };
  document.getElementById("d-b").onclick = function(){ answer(false); };
  document.onkeydown = function(e){
    if(S.stage !== "duel") return;
    if(e.key === "1"){ e.preventDefault(); answer(true); }
    if(e.key === "2"){ e.preventDefault(); answer(false); }
  };
  function dc(c,k){
    return '<button class="duelcard" id="d-'+k+'"><b>'+esc(c.word)+'</b>'+
      (c.term?'<i>'+esc(c.term)+'</i>':'')+'<span>'+esc(c.line)+'</span></button>';
  }
}

/* ---------------- cluster ---------------- */

function ranked(){ return (S.rank && S.rank.sorted.length) ? S.rank.sorted : S.keepL; }

function vCluster(){
  document.onkeydown = null;
  var all = ranked();
  var assigned = {};
  S.clusters.forEach(function(g){ g.ids.forEach(function(id){ assigned[id]=true; }); });
  var loose = all.filter(function(id){ return !assigned[id]; });

  main.innerHTML =
    '<h2>Name your groups</h2>'+
    '<p class="lede small">Your '+all.length+' lived values. Tap cards to select them, then drop them '+
      'into a group. Use your own words for the group names. Three or four groups is usually the shape of it.</p>'+
    '<div id="loose"><div class="grid" id="loosegrid"></div></div>'+
    '<div id="groups"></div>'+
    '<div class="row" style="margin:6px 0 20px"><button class="btn ghost" id="addgroup">+ New group</button></div>'+
    '<div class="sticky noprint"><div class="wrap">'+
      '<div class="small" id="left">'+loose.length+' still loose</div>'+
      '<button class="btn" id="done"'+(loose.length?" disabled":"")+'>Continue</button>'+
    '</div></div>';

  var lg = document.getElementById("loosegrid");
  lg.innerHTML = loose.length ? loose.map(function(id){
    var c = CARDS[id];
    return '<button class="chip'+(S.picked.indexOf(id)>-1?" sel":"")+'" data-id="'+id+'">'+
           '<b>'+esc(c.word)+'</b><span>'+esc(c.line)+'</span></button>';
  }).join("") : '<p class="small" style="grid-column:1/-1;margin:0">Every card has a home.</p>';

  Array.prototype.forEach.call(lg.querySelectorAll(".chip"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-id"), k = S.picked.indexOf(id);
      if(k>-1){ S.picked.splice(k,1); b.classList.remove("sel"); }
      else { S.picked.push(id); b.classList.add("sel"); }
      save(); refreshDrops();
    };
  });
  function refreshDrops(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-drop]"), function(d){
      if(S.picked.length){ d.textContent = "Drop "+S.picked.length+" here"; d.classList.remove("hidden"); }
      else d.classList.add("hidden");
    });
  }

  var gs = document.getElementById("groups");
  gs.innerHTML = S.clusters.map(function(g, gi){
    return '<div class="cluster"><header>'+
      '<input value="'+esc(g.name)+'" placeholder="Name this group" data-gi="'+gi+'">'+
      '<button class="linkbtn" data-del="'+gi+'">remove</button></header>'+
      '<div class="members">'+
        g.ids.map(function(id){
          return '<span class="member">'+esc(CARDS[id].word)+
                 '<button data-pull="'+gi+'|'+id+'" aria-label="remove">&#10005;</button></span>';
        }).join("")+
        '<button class="drop armed'+(S.picked.length?"":" hidden")+'" data-drop="'+gi+'">Drop '+
          S.picked.length+' here</button>'+
      '</div></div>';
  }).join("");

  Array.prototype.forEach.call(gs.querySelectorAll("input"), function(inp){
    inp.oninput = function(){ S.clusters[+inp.getAttribute("data-gi")].name = inp.value; save(); };
  });
  Array.prototype.forEach.call(gs.querySelectorAll("[data-drop]"), function(b){
    b.onclick = function(){
      var g = S.clusters[+b.getAttribute("data-drop")];
      S.picked.forEach(function(id){ if(g.ids.indexOf(id)<0) g.ids.push(id); });
      S.picked = []; save(); render();
    };
  });
  Array.prototype.forEach.call(gs.querySelectorAll("[data-pull]"), function(b){
    b.onclick = function(){
      var p = b.getAttribute("data-pull").split("|");
      var g = S.clusters[+p[0]], k = g.ids.indexOf(p[1]);
      if(k>-1) g.ids.splice(k,1);
      save(); render();
    };
  });
  Array.prototype.forEach.call(gs.querySelectorAll("[data-del]"), function(b){
    b.onclick = function(){ S.clusters.splice(+b.getAttribute("data-del"),1); save(); render(); };
  });
  refreshDrops();

  document.getElementById("addgroup").onclick = function(){
    S.clusters.push({ name:"", ids:S.picked.slice() }); S.picked=[]; save(); render();
  };
  document.getElementById("done").onclick = function(){ go("attribute"); };
}

/* ---------------- attribution ---------------- */

function vAttribute(){
  document.onkeydown = null;
  var top = ranked().slice(0,5);
  main.innerHTML =
    '<h2>Who gets a say?</h2>'+
    '<p class="lede small">Your top five, and the second half of the Identity question. '+
      'A person, a place, a job, a tradition, a failure. Name whatever put each one in you. '+
      'Leave any of them blank and keep going.</p>'+
    top.map(function(id){
      var c = CARDS[id];
      return '<div class="attrib"><b>'+esc(c.word)+'</b><em>'+esc(c.line)+'</em>'+
        '<input data-id="'+id+'" value="'+esc(S.attrib[id]||"")+'" '+
        'placeholder="Who or what put this in you?"></div>';
    }).join("")+
    '<div class="sticky noprint"><div class="wrap">'+
      '<button class="btn ghost" id="skip">Skip this</button>'+
      '<button class="btn" id="done">See the result</button>'+
    '</div></div>';

  Array.prototype.forEach.call(document.querySelectorAll(".attrib input"), function(inp){
    inp.oninput = function(){ S.attrib[inp.getAttribute("data-id")] = inp.value; save(); };
  });
  document.getElementById("skip").onclick = function(){ go("result"); };
  document.getElementById("done").onclick = function(){ go("result"); };
}

/* ---------------- result ---------------- */

function vResult(){
  document.onkeydown = null;
  var all = ranked(), top5 = all.slice(0,5);

  var tally = {}, order = ["Plato","Aristotle","Augustine","Aquinas"];
  order.forEach(function(k){ tally[k]=0; });
  all.forEach(function(id){ tally[CARDS[id].srcName]++; });
  var max = Math.max.apply(null, order.map(function(k){ return tally[k]; })) || 1;

  var claimed = S.lived.length;
  var pct = Math.round(claimed / DECK.cards.length * 100);

  main.innerHTML =
    '<h1>Your five</h1>'+
    '<p class="lede small">You called '+claimed+' of '+DECK.cards.length+' cards lived ('+pct+'%). '+
      'Here is what survived the cut.</p>'+
    '<ol class="top5">'+ top5.map(function(id){
      var c = CARDS[id], who = S.attrib[id];
      return '<li><div><b>'+esc(c.word)+'</b><em>'+esc(c.line)+'</em>'+
        (who?'<span class="who">Put there by '+esc(who)+'</span>':'')+'</div></li>';
    }).join("") +'</ol>'+

    (S.keepR.length ?
      '<h2>The gap</h2>'+
      '<p class="lede small">Wanted, and not yet evidenced. Each of these implies a practice, '+
        'which is what the next ninety days are for.</p>'+
      '<div class="pilewrap">'+ S.keepR.map(function(id){
        return '<span class="member">'+esc(CARDS[id].word)+'</span>'; }).join("") +'</div>'
      : '')+

    (S.inherited.length ?
      '<h2>What you inherited</h2>'+
      '<p class="lede small">'+S.inherited.length+' values that are operating in you without your '+
        'particular enthusiasm. Somebody put them there. Worth knowing which ones you would keep on purpose.</p>'+
      '<div class="pilewrap">'+ S.inherited.slice(0,24).map(function(id){
        return '<span class="member">'+esc(CARDS[id].word)+'</span>'; }).join("")+
        (S.inherited.length>24?'<span class="member">and '+(S.inherited.length-24)+' more</span>':'')+
      '</div>'
      : '')+

    (S.clusters.length ?
      '<h2>Your groups</h2><p class="lede small">In your words.</p>'+
      S.clusters.map(function(g){
        return '<div class="cluster"><header><b style="font-size:17px">'+
          esc(g.name||"Unnamed group")+'</b></header><div class="members">'+
          g.ids.map(function(id){ return '<span class="member">'+esc(CARDS[id].word)+'</span>'; }).join("")+
          '</div></div>';
      }).join("")
      : '')+

    '<h2 style="margin-top:26px">Who shaped this</h2>'+
    '<p class="lede small">Where your '+all.length+' lived values came from. Rough attribution, '+
      'since these traditions borrow from each other constantly.</p>'+
    '<div class="tally">'+ order.map(function(k){
      return '<div class="tallyrow"><b>'+k+'</b><div class="tallybar"><i style="width:'+
        Math.round(tally[k]/max*100)+'%"></i></div><span>'+tally[k]+'</span></div>';
    }).join("") +'</div>'+

    '<div class="row noprint" style="margin:24px 0">'+
      '<button class="btn ghost" id="print">Print or save as PDF</button>'+
      '<button class="btn ghost" id="copy">Copy as text</button>'+
      '<button class="btn ghost" id="back">Back to the groups</button>'+
    '</div>'+
    '<p class="tiny noprint" id="copied"></p>';

  document.getElementById("print").onclick = function(){ window.print(); };
  document.getElementById("back").onclick = function(){ go("cluster"); };
  document.getElementById("copy").onclick = function(){
    navigator.clipboard.writeText(asText(all, top5, tally, order)).then(function(){
      document.getElementById("copied").textContent = "Copied.";
    }, function(){
      document.getElementById("copied").textContent = "Copying is blocked here. Use print instead.";
    });
  };
}

function asText(all, top5, tally, order){
  var L = [];
  L.push("VALUES CARD SORT — Desire Path, Session One");
  L.push(new Date().toLocaleDateString());
  L.push("");
  L.push("MY FIVE");
  top5.forEach(function(id,i){
    L.push((i+1)+". "+CARDS[id].word+" — "+CARDS[id].line+
           (S.attrib[id] ? "  [put there by "+S.attrib[id]+"]" : ""));
  });
  L.push("");
  L.push("ALL "+all.length+" LIVED, IN ORDER");
  all.forEach(function(id,i){ L.push((i+1)+". "+CARDS[id].word); });
  if(S.keepR.length){
    L.push(""); L.push("THE GAP");
    S.keepR.forEach(function(id){ L.push("- "+CARDS[id].word+" — "+CARDS[id].line); });
  }
  if(S.clusters.length){
    L.push(""); L.push("MY GROUPS");
    S.clusters.forEach(function(g){
      L.push((g.name||"Unnamed")+": "+g.ids.map(function(id){ return CARDS[id].word; }).join(", "));
    });
  }
  if(S.inherited.length){
    L.push(""); L.push("INHERITED ("+S.inherited.length+")");
    L.push(S.inherited.map(function(id){ return CARDS[id].word; }).join(", "));
  }
  L.push("");
  L.push("CLAIMED AS LIVED: "+S.lived.length+" of "+DECK.cards.length);
  L.push("SOURCES: "+order.map(function(k){ return k+" "+tally[k]; }).join(", "));
  return L.join("\n");
}

/* ---------------- boot ---------------- */

document.getElementById("startover").onclick = function(){
  if(!confirm("Clear this sort and start from the beginning?")) return;
  S = freshState(); save(); document.onkeydown = null; render();
};

fetch("cards.json", {cache:"no-cache"}).then(function(r){
  if(!r.ok) throw new Error("deck "+r.status);
  return r.json();
}).then(function(d){
  DECK = d;
  d.cards.forEach(function(c){ CARDS[c.id]=c; });
  d.themes.forEach(function(t){ THEMES[t.id]=t; });
  S = load() || freshState();
  S.order = (S.order||[]).filter(function(id){ return CARDS[id]; });
  if(S.stage !== "welcome" && !S.order.length) S = freshState();
  render();
}).catch(function(e){
  main.innerHTML = '<h2>The deck did not load</h2><p class="small">'+esc(e.message)+
    '. This page needs cards.json sitting beside it.</p>';
});

})();
</script>
<script data-goatcounter="https://tlhg.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
