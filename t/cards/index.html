<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Values Card Sort &middot; Desire Path</title>
<meta name="description" content="A sorting instrument for the Identity session of Desire Path. 124 cards drawn from the classical virtue tradition.">
<meta name="robots" content="noindex">
<style>
:root{
  --ink:#1D1801;
  --ink-soft:#5a5340;
  --ink-faint:#8d8672;
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --rule:#e2ded1;
  --tint:#f6f4ec;
  --yes:#2f6b4f;
  --no:#9a3b2f;
  --maybe:#8a6d1f;
  --radius:14px;
  --shadow:0 1px 2px rgba(29,24,1,.08), 0 8px 28px rgba(29,24,1,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Helvetica,"Helvetica Neue",sans-serif;
  color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  overscroll-behavior:none;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#f2eee2; --ink-soft:#b9b3a1; --ink-faint:#8b8574;
    --paper:#14130f; --card:#1e1c16; --rule:#332f25; --tint:#1b1913;
    --yes:#79c39b; --no:#e08b7c; --maybe:#d9b95c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
  }
}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.app{min-height:100svh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
header.bar{
  border-bottom:1px solid var(--rule);
  padding:10px 0; position:sticky; top:0; z-index:20;
  background:var(--paper);
}
.bar .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.stepper{display:flex;gap:5px;align-items:center;flex:1;justify-content:center}
.step{width:26px;height:4px;border-radius:2px;background:var(--rule)}
.step.done{background:var(--ink-soft)}
.step.now{background:var(--ink)}
.linkbtn{background:none;border:0;padding:6px;color:var(--ink-soft);font-size:13px;text-decoration:underline}

main{flex:1;display:flex;flex-direction:column;padding:20px 0 28px}
h1{font-size:30px;line-height:1.18;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:21px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 14px;max-width:60ch}
.lede{color:var(--ink-soft)}
.small{font-size:14px;color:var(--ink-soft)}
.tiny{font-size:12.5px;color:var(--ink-faint)}

.btn{
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  border-radius:999px; padding:12px 22px; font-size:16px; font-weight:bold;
}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- welcome ---------- */
.themelist{border-top:1px solid var(--rule);margin:18px 0 22px}
.themerow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.themerow b{font-size:15px;flex:1}
.themerow span{font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

/* ---------- triage ---------- */
.deckarea{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:340px;padding:6px 0 4px}
.stack{position:relative;width:100%;max-width:400px;height:min(56svh,430px);min-height:300px}
.tcard{
  position:absolute;inset:0;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:24px;display:flex;flex-direction:column;
  touch-action:none;user-select:none;-webkit-user-select:none;
  will-change:transform;
}
.tcard.under{pointer-events:none}
.tcard .themetag{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.tcard .word{font-size:clamp(30px,8vw,42px);line-height:1.08;letter-spacing:-.025em;margin:auto 0 0;font-weight:bold}
.tcard .term{font-style:italic;color:var(--ink-faint);font-size:15px;margin-top:6px;min-height:1.4em}
.tcard .gloss{font-size:17px;color:var(--ink-soft);margin:14px 0 auto;line-height:1.45}
.tcard .flipnote{font-size:12.5px;color:var(--ink-faint);margin-top:14px}
.tcard .front{display:flex;flex-direction:column;height:100%}
.tcard .back{display:none}
.tcard.flipped .front{display:none}
.tcard.flipped .back{display:flex;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.back .line{font-size:19px;line-height:1.35;margin:10px 0 16px;font-weight:bold}
.back .meta{font-size:13.5px;color:var(--ink-soft);margin-bottom:4px}
.back .nearlist{margin-top:auto;padding-top:14px;border-top:1px solid var(--rule)}
.back .nearlist b{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:5px}
.back .nearlist span{font-size:14px;color:var(--ink-soft)}
.verdict{
  position:absolute;top:18px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:bold;padding:6px 11px;border-radius:6px;border:2px solid currentColor;opacity:0;
}
.v-yes{right:18px;color:var(--yes)} .v-no{left:18px;color:var(--no)}
.v-maybe{left:50%;transform:translateX(-50%);color:var(--maybe)}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;padding-top:14px}
.cbtn{
  border:1px solid var(--rule);background:var(--card);border-radius:999px;
  padding:11px 16px;font-size:15px;font-weight:bold;display:flex;gap:7px;align-items:center;
}
.cbtn.yes{color:var(--yes)} .cbtn.no{color:var(--no)} .cbtn.maybe{color:var(--maybe)}
.cbtn.big{padding:13px 22px}
.counts{display:flex;gap:16px;justify-content:center;padding-top:12px;font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin:0 0 14px}
.progress i{display:block;height:100%;background:var(--ink-soft);transition:width .2s}

/* ---------- grids ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:14px 0}
.chip{
  border:1px solid var(--rule);background:var(--card);border-radius:10px;
  padding:11px 12px;text-align:left;line-height:1.25;
}
.chip b{display:block;font-size:15px}
.chip span{display:block;font-size:12px;color:var(--ink-faint);margin-top:3px}
.chip.on{border-color:var(--ink);background:var(--tint);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.sel{border-color:var(--yes);box-shadow:inset 0 0 0 2px var(--yes)}
.sticky{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  padding:12px 0;margin-top:auto;
}
.sticky .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- duel ---------- */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
@media (max-width:520px){ .duel{grid-template-columns:1fr} }
.duelcard{
  border:1px solid var(--rule);background:var(--card);border-radius:var(--radius);
  padding:20px;text-align:left;min-height:150px;display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.duelcard:hover{border-color:var(--ink)}
.duelcard b{font-size:23px;letter-spacing:-.02em;line-height:1.1}
.duelcard i{font-style:italic;color:var(--ink-faint);font-size:13.5px;margin-top:4px}
.duelcard span{font-size:14.5px;color:var(--ink-soft);margin-top:10px}

/* ---------- clusters ---------- */
.cluster{border:1px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.cluster header{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cluster input{
  font:inherit;font-weight:bold;font-size:16px;border:0;border-bottom:1px dashed var(--rule);
  background:transparent;color:inherit;padding:4px 2px;flex:1;min-width:0;
}
.cluster input:focus{outline:none;border-bottom-color:var(--ink)}
.cluster .members{display:flex;flex-wrap:wrap;gap:6px}
.member{border:1px solid var(--rule);border-radius:999px;padding:5px 10px;font-size:13.5px;background:var(--tint)}
.member button{border:0;background:none;padding:0 0 0 6px;color:var(--ink-faint)}
.drop{border:1px dashed var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-faint);background:transparent}
.drop.armed{border-color:var(--yes);color:var(--yes)}

/* ---------- result ---------- */
.top5{counter-reset:t;margin:16px 0 26px;border-top:1px solid var(--rule)}
.top5 li{list-style:none;counter-increment:t;display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:flex-start}
.top5 li::before{content:counter(t);font-size:13px;color:var(--ink-faint);width:16px;padding-top:6px;font-variant-numeric:tabular-nums}
.top5 b{font-size:20px;letter-spacing:-.02em;display:block}
.top5 em{font-style:normal;font-size:15px;color:var(--ink-soft);display:block;margin-top:3px}
.tally{margin:8px 0 22px}
.tallyrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:14px}
.tallyrow b{width:78px;font-weight:normal}
.tallybar{flex:1;height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.tallybar i{display:block;height:100%;background:var(--ink-soft)}
.tallyrow span{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-faint)}
ul.plain{margin:0 0 18px;padding-left:18px}
ul.plain li{margin-bottom:5px}

footer.foot{border-top:1px solid var(--rule);padding:16px 0 30px;font-size:12.5px;color:var(--ink-faint)}
footer.foot a{color:var(--ink-faint)}
.hidden{display:none !important}

@media print{
  header.bar,.sticky,.noprint{display:none !important}
  body{color:#000;background:#fff}
  .app{min-height:0}
}
</style>
</head>
<body>
<div class="app">

<header class="bar noprint">
  <div class="wrap">
    <div class="brand">Desire Path</div>
    <div class="stepper" id="stepper"></div>
    <button class="linkbtn" id="startover">Start over</button>
  </div>
</header>

<main id="main" class="wrap"><p class="lede">Loading the deck…</p></main>

<footer class="foot noprint"><div class="wrap">
  Everything you sort stays in this browser. Nothing is uploaded.
  <span id="savenote"></span>
</div></footer>

</div>

<script>
(function(){
"use strict";

var KEY = "dp-cards-v1";
var KEEP = 15;
var DECK = null, CARDS = {}, THEMES = {};
var S = null;
var main = document.getElementById("main");

/* ---------------- state ---------------- */

function freshState(){
  return {
    stage: "welcome",
    order: [], i: 0,
    mine: [], maybe: [], not: [],
    history: [],
    keep: [],
    rank: null,
    clusters: [],
    picked: [],
    started: null
  };
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if(!raw) return null;
    var o = JSON.parse(raw);
    return (o && o.stage) ? o : null;
  } catch(e){ return null; }
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }

/* ---------------- shell ---------------- */

var STAGES = ["welcome","triage","cut","duel","cluster","result"];
function drawStepper(){
  var el = document.getElementById("stepper"), now = STAGES.indexOf(S.stage), h = "";
  for(var i=1;i<STAGES.length;i++){
    h += '<i class="step'+(i<now?" done":i===now?" now":"")+'"></i>';
  }
  el.innerHTML = h;
}
function go(stage){ S.stage = stage; save(); render(); }

var lastStage = null;
function render(){
  drawStepper();
  if(S.stage !== lastStage){ window.scrollTo(0,0); lastStage = S.stage; }
  var f = ({welcome:vWelcome, triage:vTriage, cut:vCut, duel:vDuel, cluster:vCluster, result:vResult})[S.stage];
  if(!f){ S.stage="welcome"; f = vWelcome; }
  main.innerHTML = "";
  f();
}

/* ---------------- 0. welcome ---------------- */

function vWelcome(){
  var counts = {};
  DECK.cards.forEach(function(c){ counts[c.theme] = (counts[c.theme]||0)+1; });
  var rows = DECK.themes.map(function(t){
    return '<div class="themerow"><b>'+esc(t.name)+'</b><span>'+counts[t.id]+'</span></div>';
  }).join("");

  var resumable = S.order.length && S.stage !== "welcome";
  main.innerHTML =
    '<h1>What do you actually hold?</h1>'+
    '<p class="lede">'+DECK.cards.length+' values drawn from the classical tradition, one per card. '+
      'You will sort them down to five, and name the groups yourself.</p>'+
    '<ul class="plain small">'+
      '<li><b>Sort.</b> One card at a time. Right for mine, left for not mine, up for maybe.</li>'+
      '<li><b>Read.</b> Tap a card to turn it over for the definition and the nearby cards.</li>'+
      '<li><b>Cut.</b> Take what is left down to '+KEEP+'.</li>'+
      '<li><b>Choose.</b> Two at a time, keep one, until the '+KEEP+' are in order.</li>'+
      '<li><b>Cluster.</b> Group them and give each group your own name.</li>'+
    '</ul>'+
    '<p class="small">Fifteen to twenty minutes, and it works better in one sitting.</p>'+
    '<div class="themelist">'+rows+'</div>'+
    '<div class="row">'+
      '<button class="btn" id="begin">'+(resumable?"Start a new sort":"Begin")+'</button>'+
      (resumable?'<button class="btn ghost" id="resume">Pick up where I left off</button>':'')+
    '</div>';

  document.getElementById("begin").onclick = function(){
    var keepStage = S.stage;
    S = freshState();
    S.order = shuffle(DECK.cards.map(function(c){ return c.id; }));
    S.started = Date.now();
    void keepStage;
    go("triage");
  };
  var r = document.getElementById("resume");
  if(r) r.onclick = function(){ render(); };
}

/* ---------------- 1. triage ---------------- */

function cardFace(c){
  var t = THEMES[c.theme];
  var near = (c.near||[]).map(function(n){ return CARDS[n] ? CARDS[n].word : null; })
                          .filter(Boolean).join(" · ");
  return ''+
  '<div class="front">'+
    '<div class="themetag">'+esc(t?t.name:"")+'</div>'+
    '<div class="word">'+esc(c.word)+'</div>'+
    '<div class="term">'+esc(c.term||"")+'</div>'+
    '<div class="gloss">'+esc(c.gloss)+'</div>'+
    '<div class="flipnote">Tap for more</div>'+
  '</div>'+
  '<div class="back">'+
    '<div class="themetag">'+esc(c.word)+'</div>'+
    '<div class="line">'+esc(c.line)+'</div>'+
    '<div class="meta">'+esc(c.gloss)+'</div>'+
    '<div class="meta">'+(c.term?'<i>'+esc(c.term)+'</i> · ':'')+
      'carried by '+esc(c.srcName)+'</div>'+
    (near?'<div class="nearlist"><b>Close to</b><span>'+esc(near)+'</span></div>':'')+
  '</div>'+
  '<div class="verdict v-yes">Mine</div>'+
  '<div class="verdict v-no">Not mine</div>'+
  '<div class="verdict v-maybe">Maybe</div>';
}

function vTriage(){
  if(S.i >= S.order.length){ return go("cut"); }

  var pct = Math.round(S.i / S.order.length * 100);
  main.innerHTML =
    '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
    '<div class="deckarea"><div class="stack" id="stack"></div></div>'+
    '<div class="controls">'+
      '<button class="cbtn no" data-v="not">&#10005; Not mine</button>'+
      '<button class="cbtn maybe" data-v="maybe">? Maybe</button>'+
      '<button class="cbtn yes" data-v="mine">&#10003; Mine</button>'+
    '</div>'+
    '<div class="counts">'+
      '<span>'+(S.i+1)+' of '+S.order.length+'</span>'+
      '<span>Mine '+S.mine.length+'</span>'+
      '<span>Maybe '+S.maybe.length+'</span>'+
      '<button class="linkbtn" id="undo"'+(S.history.length?"":" disabled")+'>Undo</button>'+
    '</div>'+
    '<p class="tiny" style="text-align:center;margin-top:10px">Drag the card, use the buttons, or press &larr; &uarr; &rarr;. Space turns it over.</p>';

  var stack = document.getElementById("stack");
  var nextId = S.order[S.i+1];
  if(nextId){
    var u = document.createElement("div");
    u.className = "tcard under";
    u.style.transform = "scale(.965) translateY(10px)";
    u.innerHTML = cardFace(CARDS[nextId]);
    stack.appendChild(u);
  }
  var c = CARDS[S.order[S.i]];
  var el = document.createElement("div");
  el.className = "tcard";
  el.innerHTML = cardFace(c);
  stack.appendChild(el);
  wireCard(el);

  Array.prototype.forEach.call(document.querySelectorAll(".controls .cbtn"), function(b){
    b.onclick = function(){ fly(el, b.getAttribute("data-v")); };
  });
  var ub = document.getElementById("undo");
  if(ub) ub.onclick = undo;

  document.onkeydown = function(e){
    if(S.stage !== "triage") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); fly(el,"mine"); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); fly(el,"not"); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); fly(el,"maybe"); }
    else if(e.key === " "){ e.preventDefault(); el.classList.toggle("flipped"); }
    else if(e.key.toLowerCase() === "u"){ e.preventDefault(); undo(); }
  };
}

function wireCard(el){
  var sx=0, sy=0, dx=0, dy=0, dragging=false, moved=false, pid=null;
  var vy = el.querySelector(".v-yes"), vn = el.querySelector(".v-no"), vm = el.querySelector(".v-maybe");

  el.addEventListener("pointerdown", function(e){
    if(e.button) return;
    dragging = true; moved = false; pid = e.pointerId;
    sx = e.clientX; sy = e.clientY; dx = dy = 0;
    el.setPointerCapture(pid);
    el.style.transition = "none";
  });
  el.addEventListener("pointermove", function(e){
    if(!dragging || e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    el.style.transform = "translate("+dx+"px,"+dy+"px) rotate("+(dx*0.045)+"deg)";
    var up = (dy < -40 && Math.abs(dx) < Math.abs(dy));
    vy.style.opacity = up ? 0 : Math.max(0, Math.min(1, dx/90));
    vn.style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx/90));
    vm.style.opacity = up ? Math.max(0, Math.min(1, -dy/90)) : 0;
  });
  function end(e){
    if(!dragging || (e && e.pointerId !== pid)) return;
    dragging = false;
    el.style.transition = "transform .22s ease-out, opacity .22s ease-out";
    var up = (dy < -90 && Math.abs(dx) < Math.abs(dy));
    if(up) return fly(el,"maybe");
    if(dx > 95) return fly(el,"mine");
    if(dx < -95) return fly(el,"not");
    el.style.transform = "";
    vy.style.opacity = vn.style.opacity = vm.style.opacity = 0;
    if(!moved) el.classList.toggle("flipped");
  }
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function fly(el, verdict){
  var id = S.order[S.i];
  var x = verdict === "mine" ? 520 : verdict === "not" ? -520 : 0;
  var y = verdict === "maybe" ? -620 : 0;
  el.style.transition = "transform .24s ease-in, opacity .24s ease-in";
  el.style.transform = "translate("+x+"px,"+y+"px) rotate("+(x*0.03)+"deg)";
  el.style.opacity = "0";
  S[verdict].push(id);
  S.history.push([id, verdict]);
  S.i++;
  save();
  setTimeout(function(){ document.onkeydown = null; render(); }, 170);
}

function undo(){
  var last = S.history.pop();
  if(!last) return;
  var arr = S[last[1]];
  var k = arr.lastIndexOf(last[0]);
  if(k > -1) arr.splice(k,1);
  S.i = Math.max(0, S.i-1);
  save(); document.onkeydown = null; render();
}

/* ---------------- 2. cut to fifteen ---------------- */

function vCut(){
  document.onkeydown = null;
  if(!S.keep.length){ S.keep = S.mine.slice(); }
  var pool = S.mine.concat(S.maybe);
  // keep only ids still in the pool
  S.keep = S.keep.filter(function(id){ return pool.indexOf(id) > -1; });

  var n = S.keep.length;
  var ready = (n === KEEP);
  main.innerHTML =
    '<h2>Cut to '+KEEP+'</h2>'+
    '<p class="lede small">Your pile, with the maybes underneath it. Tap to drop a card or bring one back. '+
      'The cards you let go of are still true. These '+KEEP+' are the ones you would defend.</p>'+
    '<div id="sections"></div>'+
    '<div class="sticky noprint"><div class="wrap">'+
      '<div class="small"><b id="cnt">'+n+'</b> of '+KEEP+' chosen</div>'+
      '<button class="btn" id="next"'+(ready?"":" disabled")+'>Continue</button>'+
    '</div></div>';

  var sec = document.getElementById("sections");
  sec.appendChild(chipBlock("Mine", S.mine));
  if(S.maybe.length) sec.appendChild(chipBlock("Maybe", S.maybe));
  if(!S.mine.length && !S.maybe.length){
    sec.innerHTML = '<p class="small">Nothing landed in the keep piles. '+
      '<button class="linkbtn" id="again">Sort again</button></p>';
    var a = document.getElementById("again");
    if(a) a.onclick = function(){ S = freshState(); save(); go("welcome"); };
  }

  document.getElementById("next").onclick = function(){ S.rank = null; go("duel"); };

  function chipBlock(label, ids){
    var box = document.createElement("div");
    var h = '<h3 class="tiny" style="letter-spacing:.11em;text-transform:uppercase;margin:18px 0 0">'+
            label+' &middot; '+ids.length+'</h3><div class="grid">';
    h += ids.map(function(id){
      var c = CARDS[id];
      return '<button class="chip'+(S.keep.indexOf(id)>-1?" on":"")+'" data-id="'+id+'">'+
             '<b>'+esc(c.word)+'</b><span>'+esc(THEMES[c.theme].name)+'</span></button>';
    }).join("");
    h += '</div>';
    box.innerHTML = h;
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-id"), k = S.keep.indexOf(id);
        if(k > -1){ S.keep.splice(k,1); b.classList.remove("on"); }
        else {
          if(S.keep.length >= KEEP){ b.animate([{transform:"translateX(0)"},{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(0)"}],{duration:180}); return; }
          S.keep.push(id); b.classList.add("on");
        }
        save();
        document.getElementById("cnt").textContent = S.keep.length;
        document.getElementById("next").disabled = (S.keep.length !== KEEP);
      };
    });
    return box;
  }
}

/* ---------------- 3. duel (binary-insertion ranking) ---------------- */

function initRank(){
  var pool = shuffle(S.keep.slice());
  S.rank = { sorted: [pool[0]], queue: pool.slice(1), cur: null, lo: 0, hi: 0, asked: 0,
             total: Math.ceil(pool.slice(1).reduce(function(a,_,i){ return a + Math.log2(i+2); },0)) };
  nextItem();
}
function nextItem(){
  var r = S.rank;
  if(!r.queue.length){ r.cur = null; return; }
  r.cur = r.queue.shift();
  r.lo = 0; r.hi = r.sorted.length;
}
function answer(preferCur){
  var r = S.rank;
  var mid = (r.lo + r.hi) >> 1;
  if(preferCur) r.hi = mid; else r.lo = mid + 1;
  r.asked++;
  if(r.lo >= r.hi){
    r.sorted.splice(r.lo, 0, r.cur);
    nextItem();
  }
  save(); render();
}

function vDuel(){
  document.onkeydown = null;
  if(!S.rank) { initRank(); }
  var r = S.rank;
  if(!r.cur){ return go("cluster"); }

  var mid = (r.lo + r.hi) >> 1;
  var A = CARDS[r.cur], B = CARDS[r.sorted[mid]];
  var placed = r.sorted.length, all = S.keep.length;
  var pct = Math.round((placed-1)/(all-1)*100);

  main.innerHTML =
    '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
    '<h2>Keep one</h2>'+
    '<p class="lede small">If you could carry only one of these two into the next ten years, which one? '+
      'Answer quickly. The first instinct is usually the honest one.</p>'+
    '<div class="duel">'+
      duelCard(A, "a")+
      duelCard(B, "b")+
    '</div>'+
    '<p class="tiny" style="text-align:center">'+(placed)+' of '+all+' placed. Press 1 or 2.</p>';

  function pick(which){ answer(which === "a"); }
  document.getElementById("d-a").onclick = function(){ pick("a"); };
  document.getElementById("d-b").onclick = function(){ pick("b"); };
  document.onkeydown = function(e){
    if(S.stage !== "duel") return;
    if(e.key === "1"){ e.preventDefault(); pick("a"); }
    if(e.key === "2"){ e.preventDefault(); pick("b"); }
  };

  function duelCard(c, k){
    return '<button class="duelcard" id="d-'+k+'">'+
      '<b>'+esc(c.word)+'</b>'+
      (c.term?'<i>'+esc(c.term)+'</i>':'')+
      '<span>'+esc(c.line)+'</span></button>';
  }
}

/* ---------------- 4. cluster ---------------- */

function vCluster(){
  document.onkeydown = null;
  var ranked = S.rank.sorted;
  var assigned = {};
  S.clusters.forEach(function(g){ g.ids.forEach(function(id){ assigned[id] = true; }); });
  var loose = ranked.filter(function(id){ return !assigned[id]; });

  main.innerHTML =
    '<h2>Name your groups</h2>'+
    '<p class="lede small">Tap cards to select them, then drop them into a group. '+
      'Use your own words for the group names, not mine. Four or five groups is usually the shape of it.</p>'+
    '<div id="loose"><div class="grid" id="loosegrid"></div></div>'+
    '<div id="groups"></div>'+
    '<div class="row" style="margin:6px 0 20px"><button class="btn ghost" id="addgroup">+ New group</button></div>'+
    '<div class="sticky noprint"><div class="wrap">'+
      '<div class="small" id="left">'+loose.length+' still loose</div>'+
      '<button class="btn" id="done"'+(loose.length?" disabled":"")+'>See the result</button>'+
    '</div></div>';

  var lg = document.getElementById("loosegrid");
  lg.innerHTML = loose.length ? loose.map(function(id){
    var c = CARDS[id];
    return '<button class="chip'+(S.picked.indexOf(id)>-1?" sel":"")+'" data-id="'+id+'">'+
           '<b>'+esc(c.word)+'</b><span>'+esc(c.line)+'</span></button>';
  }).join("") : '<p class="small" style="grid-column:1/-1;margin:0">Every card has a home.</p>';

  Array.prototype.forEach.call(lg.querySelectorAll(".chip"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-id"), k = S.picked.indexOf(id);
      if(k>-1){ S.picked.splice(k,1); b.classList.remove("sel"); }
      else { S.picked.push(id); b.classList.add("sel"); }
      save();
      refreshDrops();
    };
  });

  // keeps the "drop N here" targets current without redrawing the page,
  // so selecting a card never moves the ground under you
  function refreshDrops(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-drop]"), function(d){
      if(S.picked.length){ d.textContent = "Drop "+S.picked.length+" here"; d.classList.remove("hidden"); }
      else { d.classList.add("hidden"); }
    });
  }

  var gs = document.getElementById("groups");
  gs.innerHTML = S.clusters.map(function(g, gi){
    return '<div class="cluster">'+
      '<header>'+
        '<input value="'+esc(g.name)+'" placeholder="Name this group" data-gi="'+gi+'">'+
        '<button class="linkbtn" data-del="'+gi+'">remove</button>'+
      '</header>'+
      '<div class="members">'+
        g.ids.map(function(id){
          return '<span class="member">'+esc(CARDS[id].word)+
                 '<button data-pull="'+gi+'|'+id+'" aria-label="remove">&#10005;</button></span>';
        }).join("")+
        '<button class="drop armed'+(S.picked.length?"":" hidden")+'" data-drop="'+gi+'">Drop '+
          S.picked.length+' here</button>'+
      '</div></div>';
  }).join("");

  Array.prototype.forEach.call(gs.querySelectorAll("input"), function(inp){
    inp.oninput = function(){ S.clusters[+inp.getAttribute("data-gi")].name = inp.value; save(); };
  });
  Array.prototype.forEach.call(gs.querySelectorAll("[data-drop]"), function(b){
    b.onclick = function(){
      var g = S.clusters[+b.getAttribute("data-drop")];
      S.picked.forEach(function(id){ if(g.ids.indexOf(id)<0) g.ids.push(id); });
      S.picked = []; save(); render();
    };
  });
  Array.prototype.forEach.call(gs.querySelectorAll("[data-pull]"), function(b){
    b.onclick = function(){
      var p = b.getAttribute("data-pull").split("|");
      var g = S.clusters[+p[0]], k = g.ids.indexOf(p[1]);
      if(k>-1) g.ids.splice(k,1);
      save(); render();
    };
  });
  Array.prototype.forEach.call(gs.querySelectorAll("[data-del]"), function(b){
    b.onclick = function(){ S.clusters.splice(+b.getAttribute("data-del"),1); save(); render(); };
  });

  refreshDrops();

  document.getElementById("addgroup").onclick = function(){
    S.clusters.push({ name:"", ids: S.picked.slice() });
    S.picked = []; save(); render();
  };
  document.getElementById("done").onclick = function(){ go("result"); };
}

/* ---------------- 5. result ---------------- */

function vResult(){
  document.onkeydown = null;
  var ranked = S.rank.sorted;
  var top5 = ranked.slice(0,5);

  var tally = {}, order = ["Plato","Aristotle","Augustine","Aquinas"];
  order.forEach(function(k){ tally[k]=0; });
  ranked.forEach(function(id){ tally[CARDS[id].srcName]++; });
  var max = Math.max.apply(null, order.map(function(k){ return tally[k]; })) || 1;

  var themeCount = {};
  ranked.forEach(function(id){ var t = CARDS[id].theme; themeCount[t]=(themeCount[t]||0)+1; });
  var leadTheme = Object.keys(themeCount).sort(function(a,b){ return themeCount[b]-themeCount[a]; })[0];

  main.innerHTML =
    '<h1>Your five</h1>'+
    '<p class="lede small">Out of '+DECK.cards.length+' cards, you kept these. '+
      'Read the sentences straight through. That is a description of a person.</p>'+
    '<ol class="top5">'+ top5.map(function(id){
        var c = CARDS[id];
        return '<li><div><b>'+esc(c.word)+'</b><em>'+esc(c.line)+'</em></div></li>';
      }).join("") +'</ol>'+

    '<h2>Your groups</h2>'+
    '<p class="lede small">In your words.</p>'+
    S.clusters.map(function(g){
      return '<div class="cluster"><header><b style="font-size:17px">'+
        esc(g.name || "Unnamed group")+'</b></header><div class="members">'+
        g.ids.map(function(id){ return '<span class="member">'+esc(CARDS[id].word)+'</span>'; }).join("")+
        '</div></div>';
    }).join("")+

    '<h2 style="margin-top:26px">Who shaped this</h2>'+
    '<p class="lede small">Where your '+KEEP+' came from. Rough attribution, since these traditions borrow from each other constantly.</p>'+
    '<div class="tally">'+ order.map(function(k){
      return '<div class="tallyrow"><b>'+k+'</b><div class="tallybar"><i style="width:'+
             Math.round(tally[k]/max*100)+'%"></i></div><span>'+tally[k]+'</span></div>';
    }).join("") +'</div>'+
    '<p class="small">Your heaviest theme is <b>'+esc(THEMES[leadTheme].name)+'</b>, with '+
      themeCount[leadTheme]+' of your '+KEEP+'.</p>'+

    '<h2 style="margin-top:26px">Take it with you</h2>'+
    '<div class="row noprint" style="margin-bottom:24px">'+
      '<button class="btn ghost" id="print">Print or save as PDF</button>'+
      '<button class="btn ghost" id="copy">Copy as text</button>'+
      '<button class="btn ghost" id="back">Back to the groups</button>'+
    '</div>'+
    '<p class="tiny noprint" id="copied"></p>';

  document.getElementById("print").onclick = function(){ window.print(); };
  document.getElementById("back").onclick = function(){ go("cluster"); };
  document.getElementById("copy").onclick = function(){
    var txt = asText(ranked, top5, tally, order);
    navigator.clipboard.writeText(txt).then(function(){
      document.getElementById("copied").textContent = "Copied.";
    }, function(){
      document.getElementById("copied").textContent = "Copying is blocked here. Use print instead.";
    });
  };
}

function asText(ranked, top5, tally, order){
  var L = [];
  L.push("VALUES CARD SORT — Desire Path, Session One");
  L.push(new Date().toLocaleDateString());
  L.push("");
  L.push("MY FIVE");
  top5.forEach(function(id,i){ L.push((i+1)+". "+CARDS[id].word+" — "+CARDS[id].line); });
  L.push("");
  L.push("MY GROUPS");
  S.clusters.forEach(function(g){
    L.push((g.name||"Unnamed")+": "+g.ids.map(function(id){ return CARDS[id].word; }).join(", "));
  });
  L.push("");
  L.push("ALL "+ranked.length+", IN ORDER");
  ranked.forEach(function(id,i){ L.push((i+1)+". "+CARDS[id].word); });
  L.push("");
  L.push("SOURCES: "+order.map(function(k){ return k+" "+tally[k]; }).join(", "));
  return L.join("\n");
}

/* ---------------- boot ---------------- */

document.getElementById("startover").onclick = function(){
  if(!confirm("Clear this sort and start from the beginning?")) return;
  S = freshState(); save(); document.onkeydown = null; render();
};

fetch("cards.json", {cache:"no-cache"}).then(function(r){
  if(!r.ok) throw new Error("deck "+r.status);
  return r.json();
}).then(function(d){
  DECK = d;
  d.cards.forEach(function(c){ CARDS[c.id] = c; });
  d.themes.forEach(function(t){ THEMES[t.id] = t; });
  S = load() || freshState();
  // guard against a saved state built on an older deck
  S.order = (S.order||[]).filter(function(id){ return CARDS[id]; });
  if(S.stage !== "welcome" && !S.order.length){ S = freshState(); }
  var note = document.getElementById("savenote");
  if(note && S.started) note.textContent = " Your progress is saved as you go.";
  render();
}).catch(function(e){
  main.innerHTML = '<h2>The deck did not load</h2><p class="small">'+esc(e.message)+
    '. This page needs cards.json sitting beside it.</p>';
});

})();
</script>
